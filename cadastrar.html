<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Registrar Item</title>
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
    <header>
        <h1>Registrar Objeto</h1>
    </header>
    <nav>
        <a href="../index.html">Ver Itens</a>
        <a href="cadastrar.html">Registrar Item</a>
        <a href="chatbot.html">Conversar com o Bot 🤖</a>
    </nav>
    <div class="container">
        <form id="itemForm">
            <div class="form-group">
                <label>O que você quer fazer?</label>
                <select id="tipo" class="form-control">
                    <option value="achado">Eu encontrei um objeto</option>
                    <option value="perdido">Eu perdi um objeto</option>
                </select>
            </div>
            <div class="form-group">
                <label>Nome do Objeto</label>
                <input type="text" id="nome" class="form-control" placeholder="Ex: Chaveiro, Estojo" required>
            </div>
            <div class="form-group">
                <label>Local (Onde foi visto/perdido)</label>
                <input type="text" id="local" class="form-control" placeholder="Ex: Sala 4B, Refeitório" required>
            </div>
            <div class="form-group">
                <label>Descrição detalhada</label>
                <textarea id="descricao" class="form-control" rows="4" placeholder="Descreva as cores, marcas e características" required></textarea>
            </div>
            <button type="submit" style="width:100%; background:#10b981;">Cadastrar Registro</button>
        </form>
    </div>

    <script src="../assets/js/api.js"></script>
    <script>
        document.getElementById('itemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newItem = {
                tipo: document.getElementById('tipo').value,
                nome: document.getElementById('nome').value,
                local: document.getElementById('local').value,
                descricao: document.getElementById('descricao').value
            };
            await createItem(newItem);
            alert('Item registrado com sucesso!');
            window.location.href = '../index.html';
        });
    </script>
</body>
</html>
